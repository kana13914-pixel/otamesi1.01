# セリフ集テンプレート
#
# 構造: トリガーごとに condition（発火条件）と lines（返答候補）を持つ。
# lines は配列。実装側はランダムまたは条件分岐で1件を選んで使う。
# サンプルは数件のみ。実際の口調・バリエーションは追加していく。
#
# 口調ルール（CLAUDE.md参照）:
#   - 上司くらいの温度感。世話焼きだが甘やかさない
#   - 過剰な称賛・連続した励ましはしない
#   - 最終判断はユーザーに委ねる言い方にする

morning_wake:
  description: "起床操作をトリガーに、起床予定時刻との差分で分岐する"
  conditions:
    - id: on_time
      when: "起床予定時刻との差が±15分以内"
      lines:
        - "おはよう。今日も予定通りだな。"
        - "起きたか。今日の予定、確認しておけよ。"
    - id: early
      when: "起床予定時刻より15分以上早い"
      lines:
        - "早いな。無理に早起きしすぎるなよ。"
    - id: late
      when: "起床予定時刻より15分以上遅い"
      lines:
        - "少し遅いな。今日の予定、詰まってないか確認しておけ。"

work_start:
  description: "「仕事開始」操作への固定応答"
  conditions:
    - id: default
      when: "常に"
      lines:
        - "わかった。何かあったら声をかけてくれ。"
        - "了解。進捗、気になったらこっちから聞く。"

midday_check:
  description: "食事・休憩の予定時刻を一定時間過ぎても未記録のときのみ発火。基本は干渉しない"
  conditions:
    - id: meal_overdue
      when: "食事予定時刻から30分以上、記録なし"
      lines:
        - "そろそろ飯の時間、過ぎてるぞ。"
    - id: break_overdue
      when: "連続作業が90分を超えている"
      lines:
        - "休憩、挟んだほうがいいんじゃないか。"

night_check:
  description: "未完了の日課数に応じて反応を分岐"
  conditions:
    - id: all_done
      when: "未完了0件"
      lines:
        - "今日はやることちゃんと終わってるな。"
    - id: some_left
      when: "未完了1〜2件"
      lines:
        - "あと少し残ってるが、無理にやらなくてもいい。"
    - id: many_left
      when: "未完了3件以上"
      lines:
        - "結構残ってるな。今日はここまでにするか、どうする？"

before_sleep:
  description: "就寝予定時刻前後の挨拶"
  conditions:
    - id: default
      when: "常に"
      lines:
        - "おやすみ。また明日な。"

# 以下は夕方の「予定見直し提案」で、LLMを使う場面(docs/spec.md参照)。
# セリフ集ではなく、疲労度・進捗・予定データをLLMに渡して生成する。
# ここにはプロンプトの方向性のみ記載する。
evening_suggestion:
  description: "LLM呼び出し。セリフ集は使わない"
  prompt_guidance: >
    疲労度・当日の進捗・残っている予定を踏まえ、予定の見直しを提案する。
    断定せず提案にとどめる。過剰に心配しすぎない。最終判断はユーザーに委ねる。
