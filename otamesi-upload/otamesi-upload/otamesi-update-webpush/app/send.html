<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>通知テスト送信（検証用）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    label { display: block; font-size: .85rem; margin: 10px 0 4px; opacity: .85; }
    input, select { width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid #888; }
    .row { display: flex; gap: 8px; } .row > * { flex: 1; }
    small { opacity: .7; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>通知テスト送信（フェーズ0）</h1>
  <p style="font-size:.85rem">PCでスクリプトを使わずに、このページからntfyへテスト通知を送ります。iPhoneのSafariでもPCのブラウザでも使えます。</p>

  <section class="card">
    <h2>トピック</h2>
    <label for="topic">ntfyアプリで購読しているトピック名</label>
    <input id="topic" autocomplete="off" autocapitalize="off" spellcheck="false">
    <small>トピック名はパスワード相当です。この端末のブラウザ内にだけ保存され、サーバーやリポジトリには送られません（送信先のntfyを除く）。</small>
    <button id="gen-topic" type="button" style="background:#cfcfcf">推測されにくいトピック名を作る</button>
  </section>

  <section class="card">
    <h2>送信</h2>
    <label for="delay">配信タイミング</label>
    <select id="delay">
      <option value="0">今すぐ</option>
      <option value="1">1分後</option>
      <option value="3">3分後</option>
      <option value="5" selected>5分後</option>
      <option value="10">10分後</option>
    </select>
    <label for="click">タップで開くURL</label>
    <input id="click" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="send" type="button">通知を送る</button>
    <dl style="margin-top:8px">
      <dt>結果</dt><dd id="send-status">未送信</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Web Push で送る（ホーム画面のアプリで開く）</h2>
    <small>ホーム画面のアプリで「通知を有効にする」を済ませてから使います。配信タイミングは上の選択を使います。</small>
    <label for="wp-worker-url">送信サーバーのURL</label>
    <input id="wp-worker-url" placeholder="https://…workers.dev" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="wp-token">合言葉（APP_TOKEN）</label>
    <input id="wp-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="wp-send" type="button">Web Pushで送る</button>
    <button id="wp-status-btn" type="button" style="background:#cfcfcf">送信サーバーの状態を見る</button>
    <dl style="margin-top:8px">
      <dt>結果</dt><dd id="wp-status">未送信</dd>
    </dl>
  </section>

  <script src="settings.js"></script>
  <script src="send.js"></script>
</body>
</html>
